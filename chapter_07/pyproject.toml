[project]
name = "minir1"
version = "0.1.0"
description = "Mini-R1: Reproduce DeepSeek R1 aha moment with GRPO on RunPod"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Core ML libraries
    "transformers>=4.48.0",
    "datasets>=3.1.0",
    "accelerate>=1.3.0",
    "trl==0.25.0",
    # Model optimization
    "peft>=0.14.0",
    # bitsandbytes: Linux/Windows 전용. macOS arm64에서는 설치 실패하므로 조건부 설치.
    "bitsandbytes>=0.45.0; sys_platform != 'darwin'",
    # Utilities
    "huggingface-hub>=0.26.0",
    "hf-transfer>=0.1.8",
    "safetensors>=0.4.0",
    # Data processing
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.32.2",
    # Logging & monitoring
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "tensorboard>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.7.0",
]

flash-attn = [
    "flash-attn>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatch build configuration
[tool.hatch.build.targets.wheel]
packages = ["scripts"]
only-include = ["scripts", "configs"]

[tool.hatch.build.targets.sdist]
include = [
    "scripts/",
    "configs/",
    "README.md",
    "RUNPOD_SETUP.md",
    "TENSORBOARD_GUIDE.md",
    "PROGRESS.md",
    "pyproject.toml",
]

# ============================================
# UV 사용 가이드 (RunPod)
# ============================================
# 
# 1. 의존성 설치 (프로젝트 빌드 제외):
#    uv sync --no-install-project
#
# 2. uv.lock에 고정된 PyTorch/CUDA 확인:
#    uv run python -c "import torch; print(torch.__version__); print(torch.version.cuda); print(torch.cuda.is_available())"
#    → PyTorch 2.9.0, CUDA 12.8, True 출력 확인
#    → "False" 또는 에러 시 CUDA 12.8 호환 RunPod 이미지를 사용하고 uv sync를 다시 실행
#
# 3. Flash Attention (선택, 학습 속도 20% 향상):
#    ⚠️ 설치 시간: 5-15분 (GPU에 따라 다름)
#    ⚠️ 설치 실패 시 eager attention으로 대체 가능 (성능 차이 미미)
#    
#    # 설치 시도:
#    uv pip install flash-attn --no-build-isolation
#    
#    # 진행 상황 확인 (다른 터미널):
#    top -p $(pgrep -f "pip install flash")
#    # %CPU가 0%이고 5분 이상 지속 시 중단:
#    kill -9 $(pgrep -f "pip install flash")
#    
#    # Eager attention으로 전환:
#    sed -i 's/flash_attention_2/eager/' configs/training_config.yaml
#
# 4. 실행:
#    uv run python scripts/train_grpo.py --config configs/training_config.yaml
#
# 💡 Tip: Flash Attention 없이도 학습 가능합니다.
#         Eager attention 사용 시 속도는 20% 느리지만 안정적입니다.
#
# 상세 가이드: RUNPOD_SETUP.md
